# Opt-in operator mTLS identity; unrelated to Kubernetes workspaceMode=operator.
server:
  disableTls: false

certManager:
  enabled: true
  operatorClient:
    enabled: true

gatewayConfig:
  openshell.gateway.mtls_auth:
    operator_enabled: true
